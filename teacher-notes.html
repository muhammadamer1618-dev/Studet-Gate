<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملاحظات المعلمين | بوابة الفلاح</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:#17372f;font-family:Tahoma,Arial,sans-serif}header{background:linear-gradient(120deg,#004c3f,#0b7864);color:#fff;padding:22px;text-align:center}header h1{margin:0 0 8px}main{max-width:900px;margin:25px auto;padding:0 14px}.panel{background:white;border:1px solid #d9e6de;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #1231}.note{background:#f8fbf9;border:1px solid #dbe9e1;border-radius:12px;padding:15px;margin:10px 0}.note strong{color:#005744}a{color:#006653}small{color:#617a6f}#status{padding:12px}.grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.date{color:#6c8076;font-size:13px}.details{white-space:pre-wrap;line-height:1.8}.muted{color:#657b70}</style></head><body><header><h1>📝 ملاحظات المعلمين</h1><div>مدارس الفلاح الأهلية — بوابة الطالب وولي الأمر</div></header><main><a href="./">← العودة للبوابة</a><section class="panel"><h2>ملاحظات الطالب السلوكية</h2><div id="studentName" class="muted"></div><div id="status" role="status">جاري تحميل البيانات...</div><div id="notes"></div></section></main><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),$=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function loadNotes(){try{const session=window.RasedStudentSSO?.getSession?.();if(!session||!session.code){$("status").textContent="سجّل الدخول من البوابة الرئيسية أولًا.";return}
const code=String(session.code);const [setting,student,notes]=await Promise.all([db.collection("parentDisplaySettings").doc("teacherNotes").get(),db.collection("students").doc(code).get(),db.collection("studentFollowupEvents").where("studentCode","==",code).get()]);
if(!student.exists){$("status").textContent="تعذر العثور على الطالب المسجل.";return}
$("studentName").textContent="الطالب: "+(student.data().name||"")+" — "+(student.data().grade||"")+" / "+(student.data().section||"");
if(!setting.exists||setting.data().enabled!==true){$("status").textContent="ملاحظات المعلمين غير متاحة للعرض حاليًا.";return}
const list=notes.docs.map(d=>d.data()).filter(n=>String(n.kind||"").includes("سلوكي")||String(n.category||"").includes("مخالفة")||String(n.category||"").includes("سلوك")).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
$("status").textContent=list.length?"عدد الملاحظات: "+list.length:"لا توجد ملاحظات سلوكية مسجلة حاليًا.";
$("notes").innerHTML=list.map(n=>'<article class="note"><div class="grid"><strong>'+esc(n.category||n.kind||"ملاحظة")+'</strong><span class="date">'+esc(n.date||"")+'</span></div>'+(n.subjectName?'<p>المادة: '+esc(n.subjectName)+'</p>':'')+(n.details?'<p class="details">'+esc(n.details)+'</p>':'')+'<small>المعلم: '+esc(n.teacherName||"")+'</small></article>').join("");
}catch(e){$("status").textContent="تعذر تحميل الملاحظات: "+e.message}}
</script><script src="rased-student-sso.js?v=20261012-7"></script><script>window.addEventListener("load",loadNotes);</script><script src="rased-maintenance.js"></script>
</body></html>
