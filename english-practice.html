<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};

function selectOptions(){const ass=teacherAssignments(),subs=[...new Map(ass.map(a=>[String(a.subjectId),a.subjectName||a.subjectId])).entries()];$("subject").innerHTML=subs.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join("");updateClasses()}

let accessTeachers=[];
async function init(){const params=new URLSearchParams(location.search);if(params.get("activity")){$("activityCode").value=params.get("activity");await openActivity()}
const session=getStudentSession();const code=session?.code||params.get("studentCode");if(code){await loadParentActivities(code)}else{$("learner").classList.add("hidden");status("Sign in through the Student Portal to see your class activities.",true)}
return;
const r=role(),u=username();if(!u)return;
try{
if(r==="admin"||r==="superadmin"){ $("accessManager").classList.remove("hidden");$("adminGrant").classList.remove("hidden");await loadGrantedTeachers();return; }
if(r==="supervisor"){const us=await db.collection("users").doc(u).get();const p=us.exists?(us.data().permissions||{}):{};if(p.englishActivitiesManage!==true){status("ليس لديك صلاحية إدارة English Activities. اطلب of الأدمن تفعيلها.",true);return}
$("accessManager").classList.remove("hidden");$("teacherGrant").classList.remove("hidden");await loadEnglishTeachers();await loadGrantedTeachers();return}
if(r==="teacher"){const gate=await db.collection("englishActivityAccess").doc(u).get();if(!gate.exists||gate.data().enabled!==true){status("Your English supervisor has not enabled activity access yet.",true);return}
const snap=await db.collection("teachers").doc(u).get();if(!snap.exists)throw Error("Teacher account not found");currentTeacher=snap.data();if(!teacherAssignments().length){status("No English classes are assigned to this teacher.");return}selectOptions();$("manager").classList.remove("hidden");await loadActivities();return}
status("This account cannot manage English activities."); 
}catch(e){status("Unable to load permissions or account: "+e.message,true)}}
async function grantEnglishSupervisor(){if(!["admin","superadmin"].includes(role()))return;const id=$("supervisorUsername").value.trim().toLowerCase();if(!id)return $("accessStatus").textContent="Enter the supervisor username.";try{const snap=await db.collection("users").doc(id).get();if(!snap.exists||String(snap.data().role||"").toLowerCase()!=="supervisor")throw Error("حساب Supervisor غير موجود");await db.collection("users").doc(id).set({permissions:{...(snap.data().permissions||{}),englishActivitiesManage:true}}, {merge:true});$("accessStatus").textContent="تم منح الصلاحية للمشرف "+id; }catch(e){$("accessStatus").textContent="تعذر منح الصلاحية: "+e.message}}
async function loadEnglishTeachers(){const snap=await db.collection("teachers").get();accessTeachers=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>(t.assignments||[]).some(a=>a.subjectId&&a.grade&&a.section&&/english|إنجليزي|اللغة الإنجليزية/i.test(a.subjectName||a.subject||a.name||a.subjectId||"")));const granted=await db.collection("englishActivityAccess").get();const ids=new Set(granted.docs.filter(d=>d.data().enabled===true).map(d=>d.id));$("grantTeachers").innerHTML=accessTeachers.map(t=>'<label class="activity"><input type="checkbox" class="teacher-grant-check" value="'+esc(String(t.email||t.id).trim().toLowerCase())+'" '+(ids.has(String(t.email||t.id).trim().toLowerCase())?"checked":"")+'><b>'+esc(t.name||t.email||t.id)+'</b><div class="muted">'+esc(t.email||t.id)+'</div></label>').join("")||"<p>لم يتم العثور على معلمين لديهم إسناد لغة إنجليزية.</p>"}
async function loadGrantedTeachers(){try{const snap=await db.collection("englishActivityAccess").get();$("accessStatus").textContent="Enabled teacher accounts: "+snap.docs.filter(d=>d.data().enabled===true).length}catch(e){}}
async function saveTeacherGrants(){if(role()!=="supervisor"||!accessTeachers.length)return;const chosen=new Set([...document.querySelectorAll(".teacher-grant-check:checked")].map(x=>x.value));try{const batch=db.batch();accessTeachers.forEach(t=>{const id=String(t.email||t.id).trim().toLowerCase();batch.set(db.collection("englishActivityAccess").doc(id),{enabled:chosen.has(id),teacherId:id,grantedBy:username(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})});await batch.commit();$("accessStatus").textContent="تم Save Teacher Permissions."}catch(e){$("accessStatus").textContent="تعذر حفظ الصلاحيات: "+e.message}}
async function loadParentActivities(code){
 try{
  const normalized=String(code||"").trim();
  if(!normalized)throw Error("Please sign in through the Student Portal first");
  let studentData=null;
  const session=getStudentSession();
  if(session&&(String(session.code)===normalized||String(session.loginCode)===normalized)){
    studentData={name:session.name,grade:session.grade,section:session.section};
  }
  if(!studentData?.grade||!studentData?.section){
    let student=await db.collection("students").doc(normalized).get();
    if(!student.exists&&session?.docId)student=await db.collection("students").doc(session.docId).get();
    if(!student.exists){
      const byCode=await db.collection("students").where("code","==",normalized).limit(1).get();
      if(!byCode.empty)student=byCode.docs[0];
    }
    if(!student.exists)throw Error("Student record not found");
    studentData=student.data()||{};
  }
  const grade=String(studentData.grade||studentData.gradeName||studentData.className||"").trim();
  const section=String(studentData.section||studentData.classroom||studentData.class||"").trim();
  if(!grade||!section)throw Error("بيانات Grade & Section غير مكتملة في حساب الطالب");
  const snap=await db.collection("englishActivities").where("published","==",true).get();
  const norm=v=>String(v??"").trim().replace(/[أإآ]/g,"ا").replace(/\s+/g," ").toLowerCase();
  const list=snap.docs.map(x=>({id:x.id,...x.data()})).filter(x=>norm(x.grade)===norm(grade)&&norm(x.section)===norm(section));
  $("parentActivities").classList.remove("hidden");
  $("parentStudentLabel").textContent="Student: "+(studentData.name||session?.name||"")+" — "+grade+" / "+section;
  $("parentActivityList").innerHTML=list.length?list.map(x=>'<div class="activity"><strong>'+esc(x.title)+'</strong><div class="muted">'+esc(x.subjectName||"اللغة الإنجليزية")+' · '+(x.items||[]).length+' words and sentences</div><button type="button" class="start-english-activity" data-activity-id="'+esc(x.id)+'">Start Activity</button></div>').join(""):"لا توجد أنشطة منشورة لهذا Grade & Section حتى الآن.";
  $("learner").classList.add("hidden");
  status("");
 }catch(e){$("learner").classList.add("hidden");status("Unable to load activities: "+e.message,true)}
}
function getStudentSession(){try{const x=JSON.parse(localStorage.getItem("rased.student.session.v1")||"null");return x&&(!x.expiresAt||Number(x.expiresAt)>Date.now())?x:null}catch{return null}}

function getStudentSessionCode(){try{const x=JSON.parse(localStorage.getItem("rased.student.session.v1")||"null");return x&&(!x.expiresAt||Number(x.expiresAt)>Date.now())?String(x.code||""):""}catch{return ""}}
document.addEventListener("click",function(event){
 const button=event.target.closest(".start-english-activity");
 if(!button)return;
 event.preventDefault();
 startActivityById(button.dataset.activityId);
});
function startActivityById(id){$("activityCode").value=id;$("learner").classList.remove("hidden");openActivity()}
function clearForm(){editing=null;$("title").value="";$("items").value=""}
async function loadActivities(){const snap=await db.collection("englishActivities").where("teacherId","==",username()).get();activities=snap.docs.map(d=>({id:d.id,...d.data()}));$("myActivities").innerHTML=activities.length?activities.map(a=>'<div class="activity"><strong>'+esc(a.title)+'</strong><div class="muted">'+esc(a.grade+' / '+a.section)+' · '+(a.items||[]).length+' item</div><button onclick="editActivity('+JSON.stringify(a.id).replace(/"/g,"&quot;")+')">Edit</button><button class="secondary" onclick="copyLink('+JSON.stringify(a.id).replace(/"/g,"&quot;")+')">Copy Link</button><button class="secondary" onclick="viewReports('+JSON.stringify(a.id).replace(/"/g,"&quot;")+')">Results</button><button style="background:#fde8e8;color:#9f2020" onclick="deleteActivity('+JSON.stringify(a.id).replace(/"/g,"&quot;")+')">Delete</button></div>').join(""):'<p>No published activities yet.</p>'}
async function deleteActivity(id){if(role()!=="teacher"||!confirm("هل تريد Delete النشاط؟ لن يظهر للطلاب بعد الDelete."))return;const a=activities.find(x=>x.id===id);if(!a||a.teacherId!==username())return status("Access denied بDelete هذا النشاط",true);try{await db.collection("englishActivities").doc(id).delete();if(editing===id)clearForm();status("تم Delete النشاط");await loadActivities()}catch(e){status("تعذر Delete النشاط: "+e.message,true)}}
function editActivity(id){const a=activities.find(x=>x.id===id);if(!a)return;editing=id;$("title").value=a.title;$("items").value=(a.items||[]).join("\n");$("subject").value=a.subjectId;updateClasses();$("classroom").value=a.grade+'||'+a.section;scrollTo({top:0,behavior:"smooth"})}
function copyLink(id){const link=new URL(location.href);link.search="";link.searchParams.set("activity",id);navigator.clipboard?.writeText(link.href).then(()=>status("Activity link copied")).catch(()=>prompt("اCopy Link",link.href))}
async function saveActivity(){if(role()!=="teacher"||!currentTeacher)return status("Access denied",true);const [grade,section]=($("classroom").value||"").split("||"),subjectId=$("subject").value;const a=teacherAssignments().find(x=>String(x.subjectId)===subjectId&&x.grade===grade&&x.section===section);if(!a)return status("Select a valid class assignment",true);const items=$("items").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!$("title").value.trim()||!items.length||items.length>80||items.some(s=>s.length>250))return status("Enter a title and 1–80 words or sentences (up to 250 characters each)",true);
const data={title:$("title").value.trim(),items,teacherId:username(),teacherName:currentTeacher.name||username(),subjectId,subjectName:a.subjectName||a.subject||a.name||"English",grade,section,published:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};try{if(editing){const old=activities.find(x=>x.id===editing);if(!old||old.teacherId!==username())throw Error("Access denied");await db.collection("englishActivities").doc(editing).set(data,{merge:true})}else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection("englishActivities").add(data)}status("Activity published successfully");clearForm();await loadActivities()}catch(e){status("Unable to save: "+e.message,true)}}
async function openActivity(){const id=$("activityCode").value.trim();if(!/^[\w-]{8,100}$/.test(id))return status("Enter a valid activity code",true);try{const snap=await db.collection("englishActivities").doc(id).get();if(!snap.exists||snap.data().published!==true)throw Error("Activity is unavailable");selectedActivity={id,...snap.data()};attempts={};$("practice").classList.remove("hidden");$("activityTitle").textContent=selectedActivity.title;$("cards").innerHTML=selectedActivity.items.map((word,i)=>'<div class="activity" style="margin:12px 0"><div class="muted">Item '+(i+1)+' of '+selectedActivity.items.length+'</div><strong>'+esc(word)+'</strong><button onclick="speak('+i+')">🔊 Listen</button><button onclick="listen('+i+')">🎙️ Speak</button><div id="feedback-'+i+'" role="status" class="muted">Listen, then speak</div></div>').join("");$("overall").textContent="";$("practice").scrollIntoView({behavior:"smooth"});status("")}catch(e){status("تعذر Open Activity: "+e.message,true)}}
let englishVoice=null;
function chooseEnglishVoice(){
 const voices=window.speechSynthesis?.getVoices()||[];
 const english=voices.filter(v=>/^en[-_]/i.test(v.lang));
 const preferred=["Samantha","Ava","Allison","Jenny","Aria","Google US English","Microsoft Zira","Daniel"];
 englishVoice=preferred.map(name=>english.find(v=>v.name.toLowerCase().includes(name.toLowerCase()))).find(Boolean)
   ||english.find(v=>v.localService&&/^en-US/i.test(v.lang))
   ||english.find(v=>/^en-US/i.test(v.lang))
   ||english.find(v=>v.localService)||english[0]||null;
}
if("speechSynthesis" in window){chooseEnglishVoice();speechSynthesis.addEventListener?.("voiceschanged",chooseEnglishVoice)}
function speak(i){
 if(!selectedActivity||!("speechSynthesis" in window))return;
 chooseEnglishVoice();
 const utter=new SpeechSynthesisUtterance(selectedActivity.items[i]);
 utter.lang=englishVoice?.lang||"en-US";
 if(englishVoice)utter.voice=englishVoice;
 utter.rate=.95;
 utter.pitch=1;
 utter.volume=1;
 speechSynthesis.cancel();
 speechSynthesis.speak(utter);
}
function listen(i){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$("feedback-"+i).textContent="Speech recognition is not supported in this browser. Please use Chrome or a compatible browser.";return}if(!isSecureContext){$("feedback-"+i).textContent="Microphone access requires HTTPS.";return}const r=new Recognition();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;$("feedback-"+i).textContent="🎙️ Listen إليك الآن...";r.onresult=e=>{const variants=Array.from(e.results[0]).map(x=>x.transcript);const expected=normalize(selectedActivity.items[i]),correct=variants.some(x=>normalize(x)===expected);const old=attempts[i]||{tries:0,correct:false};attempts[i]={tries:old.tries+1,correct:old.correct||correct,heard:variants[0]};$("feedback-"+i).innerHTML=(correct?'<span class="good">✅ Excellent! Correct pronunciation</span>':'<span class="bad">🔁 Try again</span>')+' — Heard: '+esc(variants[0])+' — Attempts: '+attempts[i].tries;updateOverall()};r.onerror=e=>{$("feedback-"+i).textContent="Speech recognition failed ("+e.error+"). تحقق of إذن الميكروفون وTry again."};try{r.start()}catch(e){$("feedback-"+i).textContent="Unable to start microphone: "+e.message}}
function updateOverall(){const total=selectedActivity.items.length,correct=Object.values(attempts).filter(a=>a.correct).length,done=Object.keys(attempts).length;$("overall").innerHTML='<div class="score">Score: '+correct+' / '+total+' ('+Math.round(100*correct/total)+'%)</div><p>Attempted '+done+' of '+total+' items</p><button id="submitResultButton" onclick="saveResult()">Submit</button>'}
async function saveResult(){if(!selectedActivity)return;const params=new URLSearchParams(location.search);const code=params.get("studentCode")||getStudentSessionCode();if(!code||!/^[\w-]{3,60}$/.test(code.trim()))return status("Please sign in as a student",true);const total=selectedActivity.items.length,correct=Object.values(attempts).filter(x=>x.correct).length;try{const studentSnap=await db.collection("students").doc(code.trim()).get();if(!studentSnap.exists)throw Error("Unable to identify student");const studentData=studentSnap.data()||{};await db.collection("englishActivityResults").add({studentName:studentData.name||studentData.fullName||"",studentNationalId:studentData.nationalId||studentData.identityNumber||studentData.idNumber||studentData.nationalID||"",activityId:selectedActivity.id,studentCode:code.trim(),grade:selectedActivity.grade,section:selectedActivity.section,teacherId:selectedActivity.teacherId,total,correct,percent:Math.round(100*correct/total),attempts:Object.fromEntries(Object.entries(attempts).map(([k,v])=>[k,{tries:v.tries,correct:v.correct}])),createdAt:firebase.firestore.FieldValue.serverTimestamp()});status("Result submitted successfully");$("submitResultButton").disabled=true;$("submitResultButton").textContent="Submitted"}catch(e){status("Unable to submit result: "+e.message,true)}}
async function viewReports(id){const a=activities.find(x=>x.id===id);if(!a||a.teacherId!==username())return;try{const snap=await db.collection("englishActivityResults").where("activityId","==",id).get();$("reports").classList.remove("hidden");$("reportList").innerHTML='<h3>'+esc(a.title)+'</h3>'+(snap.empty?'<p>No results yet.</p>':snap.docs.map(d=>{const x=d.data();return '<div class="activity">رقم Student: '+esc(x.studentCode)+' — '+esc(x.correct)+' / '+esc(x.total)+' — '+esc(x.percent)+'%</div>'}).join(""));$("reports").scrollIntoView({behavior:"smooth"})}catch(e){status("تعذر تحميل Results: "+e.message,true)}}
(async()=>{try{const raw=localStorage.getItem("rased.student.session.v1");const ss=raw?JSON.parse(raw):null;if(ss&&ss.code&&(!ss.expiresAt||Number(ss.expiresAt)>Date.now())){const p=new URLSearchParams(location.search);if(!p.has("studentCode"))history.replaceState(null,"",location.pathname+"?studentCode="+encodeURIComponent(ss.code))}}catch(e){}await init()})();
</script></body></html>
